name: Fetch Historical Chips (One-time)

on:
  workflow_dispatch:

jobs:
  fetch-history:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch historical broker chips (2026-06-30 ~ 2026-07-25)
        env:
          FINAPI_USERNAME: ${{ secrets.FINAPI_USERNAME }}
          FINAPI_PASSWORD: ${{ secrets.FINAPI_PASSWORD }}
        run: python fetch_history.py

      - name: Commit and push daily_chips.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily_chips.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: backfill daily chips 2026-06-30~2026-07-25"
            git push
          fi
