name: Daily Broker Chips Fetch

on:
  schedule:
    # 台灣時間 16:30（UTC+8）= UTC 08:30，週一至週五
    - cron: '30 8 * * 1-5'
    # 台灣時間 21:30（UTC+8）= UTC 13:30，週一至週五
    - cron: '30 13 * * 1-5'
  workflow_dispatch:
    # 允許手動觸發（用於測試或補抓資料）

jobs:
  fetch-chips:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允許 commit & push

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch daily broker chips
        env:
          FINAPI_USERNAME: ${{ secrets.FINAPI_USERNAME }}
          FINAPI_PASSWORD: ${{ secrets.FINAPI_PASSWORD }}
        run: python fetch_daily_chips.py

      - name: Commit and push daily_chips.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f daily_chips.json ]; then
            echo "daily_chips.json 不存在（週末或假日跳過），無需 commit。"
            exit 0
          fi
          git add daily_chips.json
          if git diff --staged --quiet; then
            echo "No changes — daily_chips.json already up to date."
          else
            git commit -m "chore: daily chips $(date -u +'%Y-%m-%d %H:%M')"
            git push
          fi

