name: Debug API Fields

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Print API field names
        env:
          FINAPI_USERNAME: ${{ secrets.FINAPI_USERNAME }}
          FINAPI_PASSWORD: ${{ secrets.FINAPI_PASSWORD }}
        run: python debug_api.py
